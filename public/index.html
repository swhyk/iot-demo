<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT 温度实时监控</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .wrap {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            background: #1e293b;
            color: #94a3b8;
            white-space: nowrap;
        }

        .badge::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }

        .badge.online {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
        }

        .badge.online::before {
            background: #34d399;
        }

        .badge.offline {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }

        .badge.offline::before {
            background: #f87171;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .card {
            padding: 20px;
            border-radius: 12px;
            background: #1e293b;
            border: 1px solid #334155;
        }

        .card .label {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 34px;
            font-weight: 700;
            line-height: 1.1;
            color: #38bdf8;
        }

        .card .unit {
            font-size: 16px;
            font-weight: 400;
            color: #94a3b8;
            margin-left: 4px;
        }

        .chart-card {
            padding: 20px;
            border-radius: 12px;
            background: #1e293b;
            border: 1px solid #334155;
        }

        .chart-card .label {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .chart-box {
            position: relative;
            height: 360px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>IoT 温度实时监控</h1>
            <span id="status" class="badge">连接中…</span>
        </header>

        <section class="stats">
            <div class="card">
                <div class="label">当前温度</div>
                <div class="value"><span id="current-temp">--</span><span class="unit">℃</span></div>
            </div>
            <div class="card">
                <div class="label">累计发布条数</div>
                <div class="value"><span id="total-count">0</span><span class="unit">条</span></div>
            </div>
        </section>

        <section class="chart-card">
            <div class="label">温度趋势（最近 30 个数据点）</div>
            <div class="chart-box">
                <canvas id="temp-chart"></canvas>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
